name: Continuous Deployment (VPS)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Atomic Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          command_timeout: 45m
          script: |
            set -ex # Abort immediately on error and print trace
            export PATH="$HOME/.cargo/bin:$PATH"
            export CARGO_TARGET_DIR="/home/vibes/apps/shared/target"

            # --- 1. CONFIGURATION ---
            BASE_DIR="/home/vibes/apps"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            DEPLOY_DIR="$BASE_DIR/deployments/build_$TIMESTAMP"
            CURRENT_LINK="$BASE_DIR/current"
            ENV_FILE="$BASE_DIR/.env.production"

            echo "[DEPLOY] Started: build_$TIMESTAMP"

            # --- 2. PREPARATION ---
            mkdir -p $DEPLOY_DIR
            git clone --depth 1 -b main https://github.com/${{ github.repository }}.git $DEPLOY_DIR

            cd $DEPLOY_DIR

            # Link permanent environment file
            if [ -f "$ENV_FILE" ]; then
                ln -sfn $ENV_FILE $DEPLOY_DIR/backend/.env.production
                echo "[SUCCESS] Permanent .env.production linked"
            else
                echo "[ERROR] Permanent .env.production not found at $ENV_FILE"
                exit 1
            fi

            # --- 3. BUILD PHASE ---
            echo "[BUILD] Compiling Frontend..."
            cd $DEPLOY_DIR/frontend
            npm install
            npm run build
            
            echo "[BUILD] Compiling Backend..."
            cd $DEPLOY_DIR/backend
            cargo check --bin fiddupay
            cargo build --release --bin fiddupay

            # --- 4. DATABASE MIGRATION ---
            echo "[DATABASE] Running Migrations..."
            cd $DEPLOY_DIR/backend
            # Export DATABASE_URL from the linked .env for sqlx
            export $(grep -v '^#' .env.production | xargs)
            /home/vibes/.cargo/bin/sqlx migrate run

            # --- 5. ATOMIC SWAP ---
            echo "[DEPLOYSYNC] Performing Atomic Swap..."
            ln -sfn $DEPLOY_DIR $CURRENT_LINK

            # --- 6. RESTART SERVICES ---
            echo "[SYSTEM] Restarting Services..."
            sudo systemctl restart fiddupay
            sudo systemctl restart caddy

            # --- 7. CLEANUP (Keep only last 2 builds) ---
            echo "[SYSTEM] Cleaning up old artifact versions..."
            cd $BASE_DIR/deployments
            ls -1tr | grep "build_" | head -n -2 | xargs -r rm -rf

            echo "🚀 DEPLOYMENT SUCCESSFUL: build_$TIMESTAMP"
