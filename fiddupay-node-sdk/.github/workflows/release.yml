name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify version matches package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json has $PACKAGE_VERSION but tag is $TAG_VERSION"
            npm version $TAG_VERSION --no-git-tag-version
          else
            echo "Version already matches: $PACKAGE_VERSION"
          fi

      - name: Publish to NPM
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: FidduPay Node.js SDK ${{ steps.version.outputs.VERSION }}
          body: |
            ## FidduPay Node.js SDK ${{ steps.version.outputs.VERSION }}
            
            ### What's New
            - Consolidated CI/CD pipeline with NPM Provenance
            - Patched security vulnerabilities in `axios` and `follow-redirects`
            - Latest API feature coverage (Public Payment Widget & Notifications)
            
            ### Installation
            ```bash
            npm install @fiddupay/node-sdk@${{ steps.version.outputs.VERSION }}
            ```
            
            ### Links
            - [NPM Package](https://www.npmjs.com/package/@fiddupay/node-sdk)
            - [Documentation](https://github.com/fiddupay/fiddupay-node#readme)
          draft: false
          prerelease: false
          generate_release_notes: true
